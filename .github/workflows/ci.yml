name: ci
on:
  pull_request:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  test-resonant-settings:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Tags are needed to compute the current version number
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: django-resonant-settings
      - name: Run tests
        run: |
          uv run --locked tox
        working-directory: django-resonant-settings
  test-template-eject:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - example-code: "include_example_code=no"
            asgi: "use_asgi=no"
          - example-code: "include_example_code=yes"
            asgi: "use_asgi=no"
          - example-code: "include_example_code=yes"
            asgi: "use_asgi=yes"
    services:
      postgres:
        # Postgres depends on the OS locale for collation.
        # Alpine provides locales differently, so for better dev-prod parity, don't use it.
        image: postgres:latest
        env:
          POSTGRES_DB: django
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-start-period 30s
          --health-start-interval 2s
        ports:
          - 5432:5432
      rabbitmq:
        image: rabbitmq:4.2-management-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-start-period 30s
          --health-start-interval 2s
        ports:
          - 5672:5672
      minio:
        # This image does not require any command arguments (which GitHub Actions don't support)
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minioAccessKey
          MINIO_ROOT_PASSWORD: minioSecretKey
        options: >-
          --health-cmd "mc ready local"
          --health-timeout 1s
          --health-start-period 30s
          --health-start-interval 2s
        ports:
          - 9000:9000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Tags are needed to compute the current version number
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          # There's no lockfile at this point
          enable-cache: false
      - name: Create from template
        run: |
          uvx copier copy \
          --vcs-ref HEAD \
          --data 'project_name=Resonant' \
          --data ${{ matrix.example-code }} \
          --data ${{ matrix.asgi }} \
          --defaults \
          . \
          "${{ runner.temp }}/resonant"
      - name: Initialize lockfile
        run: |
          uv lock
        working-directory: "${{ runner.temp }}/resonant"
      - name: Add local django-resonant-settings
        run: |
          uv add "${{ github.workspace }}/django-resonant-settings[allauth]"
        working-directory: "${{ runner.temp }}/resonant"
      - name: Run tox tests from new project
        run: |
          uv run --locked tox
        env:
          DJANGO_DATABASE_URL: postgres://postgres:postgres@localhost:5432/django
          DJANGO_CELERY_BROKER_URL: amqp://localhost:5672/
          DJANGO_MINIO_STORAGE_URL: http://minioAccessKey:minioSecretKey@localhost:9000/django-storage
        working-directory: "${{ runner.temp }}/resonant"

  test-devcontainers:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Tags are needed to compute the current version number
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          # There's no lockfile at this point
          enable-cache: false
      - name: Eject from cookiecutter
        run: |
          uvx copier copy \
          --vcs-ref HEAD \
          --data project_name=Resonant \
          --data include_example_code=yes \
          --defaults \
          . \
          "${{ runner.temp }}/resonant"

      - name: Copy Dev Container test into ejected project
        run: |
          cp .github/devcontainer-smoke-test.bats "${{ runner.temp }}/resonant/"

      - name: Build and test Dev Container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            sudo apt-get update && sudo apt-get install --yes bats
            bats devcontainer-smoke-test.bats
          subFolder: "${{ runner.temp }}/resonant"
