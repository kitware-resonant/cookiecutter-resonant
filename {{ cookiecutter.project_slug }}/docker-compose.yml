services:
  postgres:
    image: postgres:alpine
    shm_size: 128mb
    environment:
      POSTGRES_DB: django
      POSTGRES_PASSWORD: postgres
      # Due to the use of musl libc in the alpine image, we need to set collation here with ICU.
      # This issue appears on ARM CPUs, and not on x86.
      # See https://github.com/docker-library/postgres/issues/1004#issuecomment-1280559846
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en_US"
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:management-alpine
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    # When run with a TTY, minio prints credentials on startup
    tty: true
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioAccessKey
      MINIO_ROOT_PASSWORD: minioSecretKey
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio:/data

volumes:
  postgres:
  minio:
  rabbitmq:
